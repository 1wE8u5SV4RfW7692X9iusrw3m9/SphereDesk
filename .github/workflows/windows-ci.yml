name: windows

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore SphereDesk.sln
      - name: Release build
        run: dotnet build SphereDesk.sln -c Release --no-restore
      - name: Core tests
        run: dotnet test tests/SphereDesk.Core.Tests/SphereDesk.Core.Tests.csproj -c Release --no-build
      - name: Windows integration tests
        run: dotnet test tests/SphereDesk.Windows.Tests/SphereDesk.Windows.Tests.csproj -c Release --no-build
      - name: Publish win-x64
        run: dotnet publish src/SphereDesk.App/SphereDesk.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/win-x64
